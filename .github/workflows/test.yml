name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The scanner is plain-stdlib, so the floor of the supported range is
        # what matters most; the top end catches new syntax/API assumptions.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile every script
        # Catches a syntax error in a script the test suite does not import.
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
